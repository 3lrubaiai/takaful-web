<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://znwszkriocjargompucf.supabase.co" crossorigin>
<title>التقرير المالي | فريق تكافل صحار التطوعي</title>
<style>






:root{
    --font-main: Arial, Tahoma, 'Noto Sans Arabic', 'Segoe UI', sans-serif;
    --ink:#eef7ef;
    --bg-0:#050e08;
    --bg-1:#0a1f12;
    --bg-2:#0f2c19;
    --leaf-1:#1c6b34;
    --leaf-2:#2c9a48;
    --leaf-3:#45c364;
    --gold:#d9c07a;
    --card-line: rgba(255,255,255,.10);
    --muted: rgba(238,247,239,.62);
  }
  *{box-sizing:border-box;}
  img{display:block;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--font-main);
    font-weight:200;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .backdrop{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(69,195,100,.16), transparent 60%),
      radial-gradient(900px 600px at -10% 15%, rgba(28,107,52,.20), transparent 55%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
  }
  .sweep{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background: conic-gradient(from 200deg at 60% 0%, transparent 0deg, rgba(69,195,100,.10) 40deg, transparent 90deg);
  }

  .wrap{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 20px 60px; }

  .host-banner{
    display:none; background:rgba(217,192,122,.12); border:1px solid rgba(217,192,122,.4); color:#f2e7c9;
    font-size:12.5px; font-weight:300; padding:10px 14px; border-radius:10px; margin-bottom:16px; line-height:1.8;
  }
  .host-banner.show{ display:block; }

  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding-bottom: 18px; border-bottom:1px solid var(--card-line);
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand img{ height:82px; width:auto; object-fit:contain; filter: drop-shadow(0 2px 10px rgba(0,0,0,.4)); }

  .lang-row{ display:flex; justify-content:center; margin-top:18px; }
  .lang-btn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); color:var(--ink);
    border-radius:999px; padding:6px 16px; font-family:inherit; font-weight:400; font-size:12.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .lang-btn:hover{ background:rgba(255,255,255,.12); }
  .lang-btn .spin{ width:11px; height:11px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .7s linear infinite; display:none; }
  .lang-btn.loading .spin{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .hero{ padding: 18px 0 8px; text-align:center; }
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:8px; color: var(--leaf-3);
    font-weight:500; font-size:14px; margin-bottom:10px;
  }
  .hero .eyebrow::before, .hero .eyebrow::after{ content:""; width:22px; height:2px; background:var(--leaf-3); border-radius:2px; }
  h1.title{
    font-family: var(--font-main); font-weight:800; margin:0;
    font-size: clamp(26px, 5vw, 44px);
    line-height:1.3;
    background: linear-gradient(90deg, #fff 10%, #cdeed4 60%, #8fd6a2 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .meta-edit{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .meta-edit .field{ width:auto; min-width:110px; margin-top:0; text-align:center; }

  /* highlight of the month */
  .highlight{
    margin-top:26px; border-radius:18px; overflow:hidden; position:relative;
    border:1px solid var(--card-line); background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
  }
  .highlight .hl-media{ position:relative; width:100%; max-height:320px; overflow:hidden; background:#0a1f12; }
  .highlight .hl-media img{ width:100%; height:320px; object-fit:cover; display:block; }
  .highlight .hl-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.35); color:#fff; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:16px; user-select:none;
  }
  .highlight .hl-prev{ right:12px; }
  .highlight .hl-next{ left:12px; }
  .highlight .hl-dots{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .highlight .hl-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4); cursor:pointer; }
  .highlight .hl-dot.active{ background:#fff; }
  .highlight .hl-body{ padding:18px 20px 22px; }
  .highlight .hl-tag{ display:inline-block; font-size:12px; font-weight:500; color:var(--leaf-3);
    background:rgba(69,195,100,.12); border:1px solid rgba(69,195,100,.3); padding:4px 12px; border-radius:20px; margin-bottom:10px; }
  .highlight h3{ font-family:var(--font-main); font-weight:700; font-size:19px; margin:0 0 8px; }
  .highlight p{ font-weight:300; font-size:14px; line-height:1.9; color:var(--muted); margin:0; white-space:pre-line; }
  .highlight-thumbs{ display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap:10px; margin-top:12px; }

  /* grid of categories */
  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin:30px 0 8px;
  }
  @media (max-width:760px){ .grid{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width:480px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    position:relative; border-radius:14px; padding:16px 16px 14px;
    background: linear-gradient(135deg, var(--leaf-2), var(--leaf-1) 70%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow: 0 8px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.10);
    overflow:hidden;
    transition: transform .18s ease, box-shadow .18s ease;
    cursor:pointer;
  }
  .card::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .card .row1{ display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
  .card .diamond{
    width:9px; height:9px; background:#fff; transform:rotate(45deg); flex:none; opacity:.9;
  }
  .card .amount{
    font-family: var(--font-main); font-weight:700; font-size: clamp(19px,2.6vw,24px);
    letter-spacing:.2px; white-space:nowrap;
  }
  .card .amount sup{ font-size:12px; font-weight:500; margin-inline-start:2px; opacity:.85; }
  .card .label{ font-weight:500; font-size:15px; margin-top:8px; position:relative; z-index:1; }
  .card .count{ font-size:12.5px; font-weight:300; color:rgba(255,255,255,.82); margin-top:2px; position:relative; z-index:1; }
  .card .expand-hint{ position:absolute; bottom:8px; left:10px; font-size:16px; opacity:.55; z-index:1; }

  .card.editing{ background: linear-gradient(135deg,#173a22,#0e2416); border:1px dashed rgba(255,255,255,.35); cursor:default; }
  .card .del-btn{
    position:absolute; top:8px; left:8px; z-index:2; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:13px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:0;
  }
  .card .detail-btn{
    margin-top:8px; width:100%; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:8px; padding:6px 8px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  .field{ width:100%; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.25); color:#fff;
    border-radius:8px; padding:6px 8px; font-family:inherit; font-weight:400; font-size:13px; margin-top:6px; }
  .field::placeholder{ color:rgba(255,255,255,.45); }
  textarea.field{ resize:vertical; font-family:inherit; }

  .add-card{
    border-radius:14px; border:1.5px dashed rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-weight:500; cursor:pointer; min-height:96px; background:rgba(255,255,255,.02);
  }
  .add-card:hover{ background:rgba(255,255,255,.05); color:#fff; }

  .total{
    margin-top:34px; text-align:center; padding:24px 16px; border-radius:18px;
    background: linear-gradient(180deg, rgba(69,195,100,.08), rgba(69,195,100,0));
    border:1px solid var(--card-line);
  }
  .total .lbl{ font-weight:500; color:var(--leaf-3); font-size:16px; margin-bottom:6px; }
  .total .num{
    font-family: var(--font-main); font-weight:700; font-size: clamp(38px,7vw,64px); line-height:1;
    color:#fff; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .total .num small{ font-size: .32em; font-weight:600; color:var(--leaf-3); }
  .total .words{ margin-top:10px; color:var(--muted); font-size:14.5px; font-weight:300; }

  section.section-block{ margin-top:38px; }
  .sec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sec-head h2{ font-family: var(--font-main); font-size:20px; margin:0; font-weight:700; }
  .sec-head .tag{ font-size:12px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:20px; font-weight:300; }
  .note{ color:var(--muted); font-size:13.5px; font-weight:300; margin-bottom:14px; line-height:1.9; }

  /* masonry-style photo grid — each image keeps its own natural aspect ratio */
  .photo-grid{ column-count:3; column-gap:10px; }
  @media (max-width:760px){ .photo-grid{ column-count:2; } }
  @media (max-width:480px){ .photo-grid{ column-count:1; } }
  .photo{ position:relative; break-inside:avoid; margin-bottom:10px; border-radius:12px; overflow:hidden;
    border:1px solid var(--card-line); background:#0a1f12; display:block; }
  .photo img{ width:100%; height:auto; display:block; }
  .photo .rm{
    position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.5);
    color:#fff; border:1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .photo-add{ border:1.5px dashed rgba(255,255,255,.3); border-radius:12px; aspect-ratio:1/1; break-inside:avoid; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:var(--muted); cursor:pointer;
    font-size:12px; text-align:center; }
  .photo-add:hover{ color:#fff; background:rgba(255,255,255,.04); }

  /* partner logo sections — logos sit directly on the page background, no frame */
  .partner-block{ margin-bottom:26px; padding-bottom:20px; border-bottom:1px solid var(--card-line); }
  .partner-block:last-child{ border-bottom:none; }
  .partner-title{ font-weight:500; font-size:15px; margin-bottom:14px; color:var(--muted); }
  .logo-grid{ display:flex; flex-wrap:wrap; align-items:center; gap:26px; }
  .logo-chip{ position:relative; height:54px; display:flex; align-items:center; }
  .logo-chip img{ max-height:100%; max-width:170px; object-fit:contain; display:block; }
  .logo-chip .rm{
    position:absolute; top:-8px; left:-8px; width:20px; height:20px; border-radius:50%; background:#1b1b1b;
    color:#fff; border:1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px;
  }
  .logo-add{ border:1.5px dashed rgba(255,255,255,.3); border-radius:10px; height:54px; width:110px; display:flex; align-items:center;
    justify-content:center; color:var(--muted); cursor:pointer; font-size:11.5px; text-align:center; padding:4px; }
  .logo-add:hover{ color:#fff; background:rgba(255,255,255,.04); }
  .partner-name-input{ margin-bottom:10px; max-width:420px; }
  .partner-del{ background:rgba(220,80,80,.15); color:#ffb4b4; border:1px solid rgba(220,80,80,.4); border-radius:8px;
    padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; margin-top:10px; }

  footer{ margin-top:44px; padding-top:20px; border-top:1px solid var(--card-line); }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .foot-row img{ display:block; }
  .updated{ text-align:center; color:rgba(238,247,239,.4); font-size:11.5px; font-weight:300; margin-top:18px; }

  .admin-bar{
    position:fixed; bottom:16px; inset-inline-end:16px; z-index:5; display:flex; align-items:center; gap:8px;
  }
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:500; border-radius:999px; padding:10px 18px; font-size:13.5px;
    display:inline-flex; align-items:center; gap:6px; transition: all .15s ease;
  }
  .btn-ghost{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18); }
  .btn-ghost:hover{ background:rgba(255,255,255,.14); }
  .btn-primary{ background: linear-gradient(90deg, var(--leaf-3), var(--leaf-2)); color:#052c11; font-weight:700; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-danger{ background: rgba(220,80,80,.18); color:#ffb4b4; border:1px solid rgba(220,80,80,.4); }

  .toast{
    position:fixed; bottom:76px; inset-inline-end:16px; z-index:6; background:#123320; color:#e9ffe9;
    border:1px solid rgba(69,195,100,.5); padding:10px 16px; border-radius:10px; font-size:13.5px; max-width:280px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transform:translateY(6px); transition: all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:10; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.show{ display:flex; }
  .modal{ background:#0e2416; border:1px solid var(--card-line); border-radius:16px; padding:22px; max-width:340px; width:100%; text-align:center; position:relative; }
  .modal h3{ margin:0 0 12px; font-family:var(--font-main); font-weight:700; }
  .modal input{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.3); color:#fff; font-size:15px; text-align:center; letter-spacing:1px; font-family:inherit; }
  .modal .actions{ display:flex; gap:8px; margin-top:14px; }
  .modal .actions button{ flex:1; }
  .modal p.hint{ color:var(--muted); font-size:12px; margin-top:10px; font-weight:300; }

  .detail-modal .modal{ max-width:440px; text-align:right; }
  .detail-modal img{ width:100%; max-height:260px; object-fit:cover; border-radius:12px; margin-bottom:14px; background:#08150c; }
  .detail-modal .d-amount{ font-weight:700; font-size:20px; color:#fff; margin-bottom:4px; }
  .detail-modal .d-count{ color:var(--muted); font-size:13px; margin-bottom:12px; font-weight:300; }
  .detail-modal p.d-text{ font-size:14px; line-height:1.9; color:var(--ink); font-weight:300; white-space:pre-line; margin:0 0 16px; }
  .detail-modal .upload-row{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .detail-modal .thumb{ width:64px; height:64px; border-radius:8px; object-fit:cover; border:1px solid var(--card-line); }
  .close-x{ position:absolute; top:14px; left:14px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .loading{ text-align:center; padding:60px 0; color:var(--muted); font-weight:300; }

  /* Performance: reserve image space and keep below-the-fold media cheap */
  .highlight .hl-media{aspect-ratio: 16 / 9; max-height:none;}
  .highlight .hl-media img{width:100%; height:100%; object-fit:cover;}
  .photo img{width:100%; height:100%; object-fit:cover;}
  .photo{aspect-ratio:4/3; overflow:hidden;}
  .logo-chip{min-height:74px;}
  .logo-chip img{max-width:100%; max-height:74px; width:auto; height:auto; object-fit:contain;}
  #app-body .deferred-media{content-visibility:auto; contain-intrinsic-size:700px;}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="sweep"></div>

<div class="wrap">

  <div class="host-banner" id="host-banner"></div>

  <header class="top">

</div>

<div class="admin-bar">

<div class="toast" id="toast"></div>

    <input type="email" id="admin-email" class="field" autocomplete="username" placeholder="البريد الإلكتروني">

    <div class="actions">
      <button class="btn btn-ghost" id="pin-cancel" type="button">إلغاء</button>
      <button class="btn btn-primary" id="pin-ok" type="button">دخول</button>

  </div>

<div class="modal-bg detail-modal" id="detail-modal">
  <div class="modal" id="detail-modal-inner"></div>
</div>

<script>
/* =========================================================
   Supabase configuration
   Replace ONLY the two values below with your project values
   from Supabase > Settings > API.
   IMPORTANT: use the Publishable key, never a secret/service_role key.
   ========================================================= */
const SUPABASE_URL = "https://znwszkriocjargompucf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jedE16Oa0rshz8XBsgOFKw_ezNRL2Uh";
let supabaseClient = null;

function ensureSupabaseScript(){
  if(window.supabase) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=resolve;
    s.onerror=()=>reject(new Error('تعذر تحميل مكتبة Supabase'));
    document.head.appendChild(s);
  });
}

async function ensureSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  await ensureSupabaseScript();
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  return supabaseClient;
}

const REPORT_ID = "takaful-suhar-report";
const STORAGE_BUCKET = "report-images";
const LANG_KEY = "lang-pref";


const ENABLE_SUPABASE_IMAGE_TRANSFORMS = false;

function displayImageUrl(item, options = {}){
  const url = typeof item === 'string' ? item : (item?.url || '');
  const path = typeof item === 'string' ? '' : (item?.path || '');
  if(!url) return '';
  if(!ENABLE_SUPABASE_IMAGE_TRANSFORMS || !path) return url;

  const transform = {
    width: options.width || 900,
    height: options.height || undefined,
    quality: options.quality || 70,
    resize: options.resize || 'cover'
  };
  if(!transform.height) delete transform.height;

  try{
    return supabaseClient.storage.from(STORAGE_BUCKET)
      .getPublicUrl(path, { transform }).data.publicUrl || url;
  }catch(e){
    return url;
  }
}

function storagePublicUrl(path){
  if(!path) return "";
  return supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(',');
  const meta = parts[0].match(/data:([^;]+);base64/);
  const mime = meta ? meta[1] : 'application/octet-stream';
  const binary = atob(parts[1]);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}

async function uploadImageDataUrl(dataUrl, folder, extension){
  const blob = dataUrlToBlob(dataUrl);
  const safeExt = extension || (blob.type === 'image/png' ? 'png' : 'jpg');
  const path = `${REPORT_ID}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,9)}.${safeExt}`;
  const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, blob, {
    contentType: blob.type,
    cacheControl: '31536000',
    upsert: false
  });
  if(error) throw error;
  return { path, url: storagePublicUrl(path) };
}

async function deleteStoragePath(path){
  if(!path) return;
  const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).remove([path]);
  if(error) console.warn('Storage delete warning:', error);
}

async function loadStateFromDatabase(){
  const { data: report, error: reportError } = await supabaseClient
    .from('reports')
    .select('id, month_name, year, total_words, initiatives_note, last_updated')
    .eq('id', REPORT_ID)
    .maybeSingle();
  if(reportError) throw reportError;
  if(!report) return null;

  const [categoriesRes, highlightRes, initiativeImagesRes, partnerSectionsRes] = await Promise.all([
    supabaseClient.from('categories').select('id, title, amount, count_text, detail_text, detail_image_url, detail_image_path, sort_order').eq('report_id', REPORT_ID).order('sort_order', {ascending:true}),
    supabaseClient.from('highlight_stories').select('id, title, text').eq('report_id', REPORT_ID).maybeSingle(),
    supabaseClient.from('initiative_images').select('id, image_url, image_path, sort_order').eq('report_id', REPORT_ID).order('sort_order', {ascending:true}),
    supabaseClient.from('partner_sections').select('id, subtitle, sort_order').eq('report_id', REPORT_ID).order('sort_order', {ascending:true})
  ]);
  for(const r of [categoriesRes, highlightRes, initiativeImagesRes, partnerSectionsRes]) if(r.error) throw r.error;

  const highlight = highlightRes.data || {id:null, title:'', text:''};
  const sections = partnerSectionsRes.data || [];
  const sectionIds = sections.map(s=>s.id);

  const [highlightImagesRes, logosRes] = await Promise.all([
    highlight.id
      ? supabaseClient.from('highlight_images').select('id, image_url, image_path, sort_order').eq('highlight_id', highlight.id).order('sort_order', {ascending:true})
      : Promise.resolve({data:[], error:null}),
    sectionIds.length
      ? supabaseClient.from('partner_logos').select('id, partner_section_id, image_url, image_path, sort_order').in('partner_section_id', sectionIds).order('sort_order', {ascending:true})
      : Promise.resolve({data:[], error:null})
  ]);
  if(highlightImagesRes.error) throw highlightImagesRes.error;
  if(logosRes.error) throw logosRes.error;
  const highlightImages = highlightImagesRes.data || [];
  const logos = logosRes.data || [];

  return {
    monthName: report.month_name || '',
    year: String(report.year || ''),
    highlight: {
      id: highlight.id,
      title: highlight.title || '',
      text: highlight.text || '',
      images: highlightImages.map(x=>({id:x.id, url:x.image_url, path:x.image_path}))
    },
    categories: (categoriesRes.data || []).map(c=>({
      id:String(c.id), title:c.title||'', amount:Number(c.amount)||0, countText:c.count_text||'',
      detailText:c.detail_text||'', detailImage:c.detail_image_url||'', detailImagePath:c.detail_image_path||''
    })),
    totalWords: report.total_words || '',
    initiativesNote: report.initiatives_note || '',
    initiativeImages: (initiativeImagesRes.data || []).map(x=>({id:x.id, url:x.image_url, path:x.image_path})),
    partnerSections: sections.map(s=>({
      id:String(s.id), subtitle:s.subtitle||'',
      logos:logos.filter(l=>String(l.partner_section_id)===String(s.id)).map(l=>({id:l.id, url:l.image_url, path:l.image_path}))
    })),
    lastUpdated: report.last_updated || null
  };
}

async function saveStateToDatabase(){
  await ensureSupabaseClient();
  const now = new Date().toISOString();
  const reportPayload = {
    id: REPORT_ID,
    month_name: state.monthName || '',
    year: state.year || '',
    total_words: state.totalWords || '',
    initiatives_note: state.initiativesNote || '',
    last_updated: now
  };
  const {error: reportError} = await supabaseClient.from('reports').upsert(reportPayload, {onConflict:'id'});
  if(reportError) throw reportError;

  const {data: oldHighlight} = await supabaseClient.from('highlight_stories').select('id').eq('report_id', REPORT_ID).maybeSingle();
  let highlightId = oldHighlight?.id || state.highlight?.id || null;
  if(state.highlight && (state.highlight.title || state.highlight.text || (state.highlight.images||[]).length)){
    if(highlightId){
      const {error} = await supabaseClient.from('highlight_stories').update({title:state.highlight.title||'', text:state.highlight.text||''}).eq('id',highlightId);
      if(error) throw error;
    }else{
      const {data,error} = await supabaseClient.from('highlight_stories').insert({report_id:REPORT_ID,title:state.highlight.title||'',text:state.highlight.text||''}).select('id').single();
      if(error) throw error;
      highlightId = data.id;
      state.highlight.id = highlightId;
    }
  }else if(highlightId){
    const {data: oldImgs, error: oldImgsError} = await supabaseClient.from('highlight_images').select('image_path').eq('highlight_id',highlightId);
    if(oldImgsError) throw oldImgsError;
    for(const img of (oldImgs||[])) if(img.image_path) await deleteStoragePath(img.image_path);
    const {error} = await supabaseClient.from('highlight_stories').delete().eq('id',highlightId);
    if(error) throw error;
    highlightId = null;
  }

  const {data: dbCats, error: dbCatsError} = await supabaseClient.from('categories').select('id, detail_image_path').eq('report_id',REPORT_ID);
  if(dbCatsError) throw dbCatsError;
  const currentCatIds = state.categories.map(c=>String(c.id));
  const removedCats = (dbCats||[]).filter(c=>!currentCatIds.includes(String(c.id)));
  for(const c of removedCats){
    if(c.detail_image_path) await deleteStoragePath(c.detail_image_path);
    const {error} = await supabaseClient.from('categories').delete().eq('id',c.id);
    if(error) throw error;
  }
  if(state.categories.length){
    const rows = state.categories.map((c,i)=>({
      id:String(c.id), report_id:REPORT_ID, title:c.title||'', amount:Number(c.amount)||0,
      count_text:c.countText||'', detail_text:c.detailText||'', detail_image_url:c.detailImage||'',
      detail_image_path:c.detailImagePath||'', sort_order:i
    }));
    const {error} = await supabaseClient.from('categories').upsert(rows,{onConflict:'id'});
    if(error) throw error;
  }

  const {data: dbInit, error: dbInitError} = await supabaseClient.from('initiative_images').select('id,image_path').eq('report_id',REPORT_ID);
  if(dbInitError) throw dbInitError;
  const initIds = (state.initiativeImages||[]).map(x=>String(x.id));
  for(const row of (dbInit||[]).filter(x=>!initIds.includes(String(x.id)))){
    if(row.image_path) await deleteStoragePath(row.image_path);
    const {error} = await supabaseClient.from('initiative_images').delete().eq('id',row.id);
    if(error) throw error;
  }
  if((state.initiativeImages||[]).length){
    const rows = state.initiativeImages.map((x,i)=>({id:x.id,report_id:REPORT_ID,image_url:x.url,image_path:x.path,sort_order:i}));
    const {error} = await supabaseClient.from('initiative_images').upsert(rows,{onConflict:'id'});
    if(error) throw error;
  }

  const {data: dbSections, error: dbSecError} = await supabaseClient.from('partner_sections').select('id').eq('report_id',REPORT_ID);
  if(dbSecError) throw dbSecError;
  const secIds = (state.partnerSections||[]).map(s=>String(s.id));
  for(const row of (dbSections||[]).filter(x=>!secIds.includes(String(x.id)))){
    const {data: oldLogos} = await supabaseClient.from('partner_logos').select('image_path').eq('partner_section_id',row.id);
    for(const l of (oldLogos||[])) if(l.image_path) await deleteStoragePath(l.image_path);
    const {error} = await supabaseClient.from('partner_sections').delete().eq('id',row.id);
    if(error) throw error;
  }
  if((state.partnerSections||[]).length){
    const rows = state.partnerSections.map((s,i)=>({id:String(s.id),report_id:REPORT_ID,subtitle:s.subtitle||'',sort_order:i}));
    const {error} = await supabaseClient.from('partner_sections').upsert(rows,{onConflict:'id'});
    if(error) throw error;
    for(const s of state.partnerSections){
      const {data: oldLogos, error: oldLogosError} = await supabaseClient.from('partner_logos').select('id,image_path').eq('partner_section_id',s.id);
      if(oldLogosError) throw oldLogosError;
      const logoIds = (s.logos||[]).map(x=>String(x.id));
      for(const l of (oldLogos||[]).filter(x=>!logoIds.includes(String(x.id)))){
        if(l.image_path) await deleteStoragePath(l.image_path);
        const {error} = await supabaseClient.from('partner_logos').delete().eq('id',l.id);
        if(error) throw error;
      }
      if((s.logos||[]).length){
        const logoRows = s.logos.map((x,i)=>({id:x.id,partner_section_id:s.id,image_url:x.url,image_path:x.path,sort_order:i}));
        const {error} = await supabaseClient.from('partner_logos').upsert(logoRows,{onConflict:'id'});
        if(error) throw error;
      }
    }
  }

  if(highlightId){
    const {data: oldImgs, error: oldImgsError} = await supabaseClient.from('highlight_images').select('id,image_path').eq('highlight_id',highlightId);
    if(oldImgsError) throw oldImgsError;
    const imgIds = (state.highlight.images||[]).map(x=>String(x.id));
    for(const img of (oldImgs||[]).filter(x=>!imgIds.includes(String(x.id)))){
      if(img.image_path) await deleteStoragePath(img.image_path);
      const {error} = await supabaseClient.from('highlight_images').delete().eq('id',img.id);
      if(error) throw error;
    }
    if((state.highlight.images||[]).length){
      const rows = state.highlight.images.map((x,i)=>({id:x.id,highlight_id:highlightId,image_url:x.url,image_path:x.path,sort_order:i}));
      const {error} = await supabaseClient.from('highlight_images').upsert(rows,{onConflict:'id'});
      if(error) throw error;
    }
  }

  state.lastUpdated = now;
}

async function migrateLegacyStateIfNeeded(){
  await ensureSupabaseClient();
  const {data: legacy, error} = await supabaseClient.from('report_state').select('data').eq('id',REPORT_ID).maybeSingle();
  if(error) return false;
  if(!legacy?.data) return false;
  const legacyState = legacy.data;
  if(!legacyState.categories) return false;
  if(!isAdmin) return false;
  showToast('تم العثور على بيانات قديمة. جارِ ترحيلها إلى الجداول الجديدة…');
  state = legacyState;
  state.highlight = state.highlight || {title:'',text:'',images:[]};
  state.categories = state.categories || [];
  state.initiativeImages = state.initiativeImages || [];
  state.partnerSections = state.partnerSections || [];
  // Images embedded as data URLs are uploaded to Storage before saving relational rows.
  const hImgs=[];
  for(const src of state.highlight.images||[]){
    const up=await uploadImageDataUrl(src,'highlight','jpg'); hImgs.push({id:crypto.randomUUID(),url:up.url,path:up.path});
  }
  state.highlight.images=hImgs;
  for(const c of state.categories){
    if(c.detailImage && c.detailImage.startsWith('data:')){
      const up=await uploadImageDataUrl(c.detailImage,'categories','jpg'); c.detailImage=up.url; c.detailImagePath=up.path;
    }
  }
  const initImgs=[];
  for(const src of state.initiativeImages||[]){
    const up=await uploadImageDataUrl(src,'initiatives','jpg'); initImgs.push({id:crypto.randomUUID(),url:up.url,path:up.path});
  }
  state.initiativeImages=initImgs;
  for(const sec of state.partnerSections){
    const out=[];
    for(const src of sec.logos||[]){
      const up=await uploadImageDataUrl(src,'partners','png'); out.push({id:crypto.randomUUID(),url:up.url,path:up.path});
    }
    sec.logos=out;
  }
  await saveStateToDatabase();
  showToast('تم ترحيل البيانات القديمة بنجاح ✓');
  return true;
}

async function normalizeState(loaded){
  state = loaded || defaultState();
  state.highlight = state.highlight || {title:'',text:'',images:[]};
  state.highlight.images = state.highlight.images || [];
  state.categories = (state.categories||[]).map(c=>({
    id:String(c.id||uid()), title:c.title||'', amount:Number(c.amount)||0,
    countText:c.countText||'', detailText:c.detailText||'', detailImage:c.detailImage||'', detailImagePath:c.detailImagePath||''
  }));
  state.initiativeImages = (state.initiativeImages||[]).map(x=>typeof x==='string'?{id:crypto.randomUUID(),url:x,path:''}:x);
  state.partnerSections = (state.partnerSections||[]).map(sec=>({
    id:String(sec.id||uid()), subtitle:sec.subtitle||sec.projectName||'',
    logos:(sec.logos||[]).map(x=>typeof x==='string'?{id:crypto.randomUUID(),url:x,path:''}:x)
  }));
  return state;
}

function snapshotUrl(){
  return new URL('./data/report.json', document.baseURI).href;
}

async function loadStateFromSnapshot(){
  const response = await fetch(snapshotUrl() + '?v=' + Date.now(), {cache:'no-store'});
  if(!response.ok) throw new Error('تعذر تحميل ملف التقرير الثابت: HTTP ' + response.status);
  const payload = await response.json();
  return {
    monthName: payload.report?.monthName || '',
    year: String(payload.report?.year || ''),
    totalWords: payload.report?.totalWords || '',
    initiativesNote: payload.report?.initiativesNote || '',
    lastUpdated: payload.report?.lastUpdated || null,
    highlight: payload.highlight || {title:'',text:'',images:[]},
    categories: payload.categories || [],
    initiativeImages: payload.initiativeImages || [],
    partnerSections: payload.partnerSections || []
  };
}

function getCachedSnapshot(){
  try{ const raw=localStorage.getItem('takaful-public-snapshot'); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function cacheSnapshot(value){
  try{ localStorage.setItem('takaful-public-snapshot', JSON.stringify(value)); }catch(e){}
}

async function refreshPublicSnapshotInBackground(){
  try{
    const fresh=await loadStateFromSnapshot();
    cacheSnapshot(fresh);
    const changed = JSON.stringify(fresh)!==JSON.stringify(state);
    if(changed){
      await normalizeState(fresh);
      lang=getLocalLanguage();
      render();
    }
  }catch(e){
    console.warn('Background snapshot refresh failed:',e);
  }
}

async function loadState(){
  showHostBanner();
  const cached=getCachedSnapshot();
  if(cached){
    await normalizeState(cached);
    lang=getLocalLanguage();
    render();
    refreshPublicSnapshotInBackground();
    return;
  }
  try{
    const loaded=await loadStateFromSnapshot();
    cacheSnapshot(loaded);
    await normalizeState(loaded);
  }catch(e){
    console.error('snapshot load error:',e);
    state=defaultState();
    showToast('تعذّر تحميل ملف التقرير الثابت. شغّل مزامنة GitHub Actions.');
  }
  lang=getLocalLanguage();
  render();
}
async function saveState(){
  if(!isAdmin){ showToast('يجب تسجيل الدخول كمدير أولًا'); return; }
  try{
    await saveStateToDatabase();
    showToast('تم حفظ التحديثات في قاعدة البيانات بنجاح ✓');
  }catch(e){
    console.error('saveState error:',e);
    showToast('تعذّر الحفظ: ' + (e.message || 'خطأ غير معروف'));
  }
  render();
}

function setLocalLanguage(value){
  try { localStorage.setItem(LANG_KEY, value); } catch(e) {}
}

function getLocalLanguage(){
  try { return localStorage.getItem(LANG_KEY) || "ar"; }
  catch(e) { return "ar"; }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- translation via the built-in Claude API bridge ---------- */
async function translateTexts(list){
  const uniq = [...new Set(list.filter(s => s && s.trim().length))];
  const need = uniq.filter(s => !translationCache[s]);
  if(!need.length) return;
  try{
    const prompt = "Translate each of the following Arabic phrases into short, natural English suited for a nonprofit financial report UI. " +
      "Return ONLY a raw JSON array of strings, same order, same length, no commentary, no markdown fences.\n\n" +
      JSON.stringify(need, null, 0);
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    let text = (data.content||[]).map(b=>b.text||'').join('');
    text = text.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
    const arr = JSON.parse(text);
    need.forEach((orig,i)=>{ if(typeof arr[i] === 'string') translationCache[orig] = arr[i]; });
  }catch(e){
    // translation unavailable (e.g. hosted outside Claude.ai) — fall back silently to original text
  }
}

function tr(str){
  if(lang !== 'en') return str || '';
  if(!str) return '';
  return translationCache[str] || str;
}

async function ensureEnglishReady(){
  const texts = [];
  state.categories.forEach(c=>{ texts.push(c.title); texts.push(c.countText); if(c.detailText) texts.push(c.detailText); });
  if(state.initiativesNote) texts.push(state.initiativesNote);
  if(state.totalWords) texts.push(state.totalWords);
  if(state.highlight.title) texts.push(state.highlight.title);
  if(state.highlight.text) texts.push(state.highlight.text);
  state.partnerSections.forEach(s=>{ if(s.subtitle) texts.push(s.subtitle); });
  await translateTexts(texts);
}

function renderHighlight(t){
  const wrap = document.getElementById('highlight-wrap');
  const h = state.highlight;
  const imgs = h.images || [];

  if(isAdmin){
    const thumbs = imgs.map((src,idx)=>`
      <div class="photo">
        <img src="${typeof src === 'string' ? src : src.url}" alt="">
        <div class="rm" data-hlidx="${idx}">✕</div>
      </div>
    `).join('');
    wrap.innerHTML = `
      <div class="highlight">
        <div class="hl-body">
          <div class="hl-tag">${t.highlightTitle}</div>
          <input class="field" id="hl-title-input" type="text" placeholder="عنوان الخبر" value="${escapeHtml(h.title||'')}" style="font-weight:700;margin-bottom:8px;">
          <textarea class="field" id="hl-text-input" rows="3" placeholder="تفاصيل مختصرة عن أبرز خبر هذا الشهر...">${escapeHtml(h.text||'')}</textarea>
          <div class="highlight-thumbs">
            ${thumbs}
            <div class="photo-add" id="hl-add"><span style="font-size:20px;">＋</span>إضافة صورة</div>
          </div>
          <input type="file" id="hl-file" accept="image/*" multiple style="display:none;">
        </div>
      </div>`;
    return;
  }

  if(!h.text && !imgs.length && !h.title){ wrap.innerHTML=''; return; }
  if(highlightIdx >= imgs.length) highlightIdx = 0;

  const mediaBlock = imgs.length ? `
    <div class="hl-media">
      <img id="hl-img-el"
           src="${displayImageUrl(imgs[highlightIdx], {width:900, height:506, quality:72})}"
           alt=""
           width="900"
           height="506"
           loading="eager"
           fetchpriority="high"
           decoding="async">
      ${imgs.length > 1 ? `
        <div class="hl-nav hl-prev" id="hl-prev">›</div>
        <div class="hl-nav hl-next" id="hl-next">‹</div>
        <div class="hl-dots">${imgs.map((_,i)=>`<span class="hl-dot${i===highlightIdx?' active':''}" data-i="${i}"></span>`).join('')}</div>
      ` : ''}
    </div>` : '';

  wrap.innerHTML = `
    <div class="highlight">
      ${mediaBlock}
      <div class="hl-body">
        <div class="hl-tag">${t.highlightTitle}</div>
        ${h.title ? `<h3>${escapeHtml(tr(h.title))}</h3>` : ''}
        ${h.text ? `<p>${escapeHtml(tr(h.text))}</p>` : ''}
      </div>
    </div>`;

  const prevBtn = document.getElementById('hl-prev');
  const nextBtn = document.getElementById('hl-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ highlightIdx = (highlightIdx+1) % imgs.length; renderHighlight(t); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ highlightIdx = (highlightIdx-1+imgs.length) % imgs.length; renderHighlight(t); });
  document.querySelectorAll('.hl-dot').forEach(d=>{
    d.addEventListener('click', e=>{ highlightIdx = parseInt(e.target.dataset.i,10); renderHighlight(t); });
  });
}

function renderMeta(){
  const metaWrap = document.getElementById('edit-meta');
  if(isAdmin){
    metaWrap.style.display = 'flex';
    metaWrap.innerHTML = `
      <input class="field" id="month-input" type="text" value="${escapeHtml(state.monthName)}" placeholder="الشهر">
      <input class="field" id="year-input" type="text" value="${escapeHtml(state.year)}" placeholder="السنة">
    `;
  } else {
    metaWrap.style.display = 'none';
    metaWrap.innerHTML = '';
  }
}

function renderBody(t){
  const body = document.getElementById('app-body');
  body.innerHTML = '';

  // FIRST PAINT: only text/cards that define the report.
  const grid = document.createElement('div');
  grid.className = 'grid';

  state.categories.forEach(cat=>{
    const card = document.createElement('div');
    card.className = 'card' + (isAdmin ? ' editing' : '');
    if(isAdmin){
      card.innerHTML = `
        <div class="del-btn" data-id="${cat.id}" title="حذف">✕</div>
        <div class="row1"><span class="diamond"></span><input class="field amount-input" data-id="${cat.id}" type="number" value="${cat.amount}" placeholder="المبلغ"></div>
        <input class="field title-input" data-id="${cat.id}" type="text" value="${escapeHtml(cat.title)}" placeholder="اسم البند">
        <input class="field count-input" data-id="${cat.id}" type="text" value="${escapeHtml(cat.countText||'')}" placeholder="العدد / الوصف">
        <button class="detail-btn" data-id="${cat.id}" type="button">🖼️ تفاصيل البند (صورة ونص)</button>
      `;
    } else {
      card.dataset.id = cat.id;
      card.innerHTML = `
        <div class="row1"><span class="diamond"></span><span class="amount">${fmt(cat.amount)}<sup>${t.currency}</sup></span></div>
        <div class="label">${escapeHtml(tr(cat.title))}</div>
        <div class="count">${escapeHtml(tr(cat.countText||''))}</div>
        <div class="expand-hint">›</div>
      `;
    }
    grid.appendChild(card);
  });

  if(isAdmin){
    const addCard = document.createElement('div');
    addCard.className = 'add-card';
    addCard.id = 'add-category';
    addCard.textContent = '+ إضافة بند جديد';
    grid.appendChild(addCard);
  }
  body.appendChild(grid);

  const totalWordsRow = state.totalWords ? `<div class="words">${escapeHtml(tr(state.totalWords))}</div>` : '';
  const totalSec = document.createElement('div');
  totalSec.className = 'total';
  totalSec.innerHTML = `
    <div class="lbl">${t.totalLabel}</div>
    <div class="num">${fmt(totalAmount())}<small>${t.currency}</small></div>
    ${isAdmin ? `<input class="field" id="words-input" style="max-width:420px;margin:10px auto 0;" value="${escapeHtml(state.totalWords||'')}" placeholder="المبلغ كتابةً (اختياري)">` : totalWordsRow}
  `;
  body.appendChild(totalSec);

  // Attach the handlers needed for the immediately visible part now.
  attachBodyHandlers(t);

  // DEFERRED: images and partner logos are appended after first paint.
  requestAnimationFrame(()=>{
    setTimeout(()=>renderDeferredMedia(t), 120);
  });
}

function renderDeferredMedia(t){
  const body = document.getElementById('app-body');
  if(!body) return;

  const deferred = document.createElement('div');
  deferred.id = 'deferred-media';
  deferred.className = 'deferred-media';

  const initImages = (state.initiativeImages||[]).map((src,idx)=>`
    <div class="photo">
      <img src="${displayImageUrl(src, {width:700, height:520, quality:68})}"
           alt="مبادرة مجتمعية"
           width="700"
           height="520"
           loading="lazy"
           decoding="async"
           fetchpriority="low">
      ${isAdmin ? `<div class="rm" data-idx="${idx}">✕</div>` : ''}
    </div>
  `).join('');

  const initSec = document.createElement('section');
  initSec.className = 'section-block';
  initSec.innerHTML = `
    <div class="sec-head">
      <h2>${t.initiativesTitle}</h2>
      <span class="tag">${t.photosCount((state.initiativeImages||[]).length)}</span>
    </div>
    ${isAdmin
      ? `<textarea class="field" id="note-input" rows="2" placeholder="وصف المبادرات (مثال: التبرع بالدم | جمع البلاستيك)">${escapeHtml(state.initiativesNote||'')}</textarea>`
      : (state.initiativesNote ? `<div class="note">${escapeHtml(tr(state.initiativesNote))}</div>` : '')}
    <div class="photo-grid" id="photo-grid" style="margin-top:12px;">
      ${initImages}
      ${isAdmin ? `<div class="photo-add" id="photo-add"><span style="font-size:20px;">＋</span>إضافة صورة</div>` : ''}
    </div>
    <input type="file" id="photo-file" accept="image/*" multiple style="display:none;">
  `;
  deferred.appendChild(initSec);

  if(isAdmin || (state.partnerSections||[]).length){
    const pSec = document.createElement('section');
    pSec.className = 'section-block';

    const blocks = (state.partnerSections||[]).map(sec=>{
      const logos = (sec.logos||[]).map((src,idx)=>`
        <div class="logo-chip">
          <img src="${displayImageUrl(src, {width:300, height:120, quality:65})}"
               alt=""
               width="300"
               height="120"
               loading="lazy"
               decoding="async"
               fetchpriority="low">
          ${isAdmin ? `<div class="rm" data-sec="${sec.id}" data-idx="${idx}">✕</div>` : ''}
        </div>
      `).join('');

      if(isAdmin){
        return `
          <div class="partner-block" data-sec="${sec.id}">
            <input class="field partner-name-input" data-sec="${sec.id}" type="text" value="${escapeHtml(sec.subtitle||'')}" placeholder="النص الفرعي لهذا القسم (مثال: شكرًا لشركائنا في مشروع إعادة التدوير)">
            <div class="logo-grid">
              ${logos}
              <div class="logo-add" data-sec="${sec.id}">+ إضافة شعار<br>(PNG شفاف)</div>
            </div>
            <input type="file" class="logo-file" data-sec="${sec.id}" accept="image/png,image/svg+xml,image/webp" multiple style="display:none;">
            <button class="partner-del" data-sec="${sec.id}" type="button">حذف هذا القسم</button>
          </div>`;
      }

      if(!sec.subtitle && !(sec.logos||[]).length) return '';
      return `
        <div class="partner-block">
          <div class="partner-title">${escapeHtml(tr(sec.subtitle||''))}</div>
          <div class="logo-grid">${logos}</div>
        </div>`;
    }).join('');

    pSec.innerHTML = `
      <div class="sec-head"><h2>${t.partnersSectionTitle}</h2></div>
      ${blocks}
      ${isAdmin ? `<button class="btn btn-ghost" id="add-partner-section" type="button">+ إضافة قسم شركاء جديد</button>` : ''}
    `;
    deferred.appendChild(pSec);
  }

  body.appendChild(deferred);
  attachBodyHandlers(t);
}

function attachHandlers(t){
  const langBtn = document.getElementById('lang-btn');
  langBtn.onclick = async ()=>{
    if(lang === 'ar'){
      langBtn.classList.add('loading');
      await ensureEnglishReady();
      langBtn.classList.remove('loading');
      lang = 'en';
    } else {
      lang = 'ar';
    }
    setLocalLanguage(lang);
    render();
  };

  const monthInput = document.getElementById('month-input');
  if(monthInput) monthInput.addEventListener('input', e=>{
    state.monthName = e.target.value;
    document.getElementById('title-text').textContent = T[lang].titleLine(state.monthName, state.year);
  });
  const yearInput = document.getElementById('year-input');
  if(yearInput) yearInput.addEventListener('input', e=>{
    state.year = e.target.value;
    document.getElementById('title-text').textContent = T[lang].titleLine(state.monthName, state.year);
  });

  const hlTitle = document.getElementById('hl-title-input');
  if(hlTitle) hlTitle.addEventListener('input', e=>{ state.highlight.title = e.target.value; });
  const hlText = document.getElementById('hl-text-input');
  if(hlText) hlText.addEventListener('input', e=>{ state.highlight.text = e.target.value; });
  const hlAdd = document.getElementById('hl-add');
  const hlFile = document.getElementById('hl-file');
  if(hlAdd) hlAdd.addEventListener('click', ()=> hlFile.click());
  if(hlFile) hlFile.addEventListener('change', async e=>{
    const files = Array.from(e.target.files||[]);
    for(const f of files){
      const dataUrl = await resizeImageJPEG(f, 900, 0.75);
      const up = await uploadImageDataUrl(dataUrl, 'highlight', 'jpg');
      state.highlight.images = state.highlight.images || [];
      state.highlight.images.push({id:crypto.randomUUID(), url:up.url, path:up.path});
    }
    render();
  });
  document.querySelectorAll('.highlight-thumbs .rm').forEach(el=>{
    el.addEventListener('click', async e=>{
      const idx = parseInt(e.target.dataset.hlidx,10);
      const removed = state.highlight.images.splice(idx,1)[0];
      if(removed?.path) await deleteStoragePath(removed.path);
      render();
    });
  });

  document.getElementById('admin-toggle').onclick = async ()=>{
    if(isAdmin){
      await logoutAdmin();
    }else{
      await initSupabaseAuth();
      document.getElementById('pin-modal').classList.add('show');
      document.getElementById('admin-email').value = '';
      document.getElementById('pin-input').value = '';
      document.getElementById('admin-logout').style.display = 'none';
      document.getElementById('admin-email').focus();
    }
  };
  document.getElementById('save-btn').onclick = saveState;
}

function resizeImageJPEG(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* preserves transparency — used for partner/company logos */
function resizeImagePNG(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  const inner = document.getElementById('detail-modal-inner');
  inner.innerHTML = `
    <div class="close-x" id="detail-close">✕</div>
    ${cat.detailImage ? `<img src="${cat.detailImage}" alt="" decoding="async">` : ''}
    <div class="d-amount">${fmt(cat.amount)} ${t.currency}</div>
    <div class="d-count">${escapeHtml(tr(cat.title))}${cat.countText ? ' · ' + escapeHtml(tr(cat.countText)) : ''}</div>

  `;

function openDetailEdit(id, t){
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  const inner = document.getElementById('detail-modal-inner');
  inner.innerHTML = `
    <div class="close-x" id="detail-close">✕</div>
    <h3>تفاصيل: ${escapeHtml(cat.title)}</h3>
    ${cat.detailImage ? `<img src="${cat.detailImage}" alt="" decoding="async">` : ''}
    <textarea class="field" id="d-text-input" rows="3" placeholder="نص مختصر (٣ أسطر تقريبًا) يوضح تفاصيل هذا البند...">${escapeHtml(cat.detailText||'')}</textarea>
    <div class="upload-row">
      <button class="btn btn-ghost" id="d-img-btn" type="button">${cat.detailImage ? 'تغيير الصورة' : 'إضافة صورة'}</button>
      ${cat.detailImage ? `<button class="btn btn-danger" id="d-img-rm" type="button">حذف الصورة</button>` : ''}
    </div>
    <input type="file" id="d-file" accept="image/*" style="display:none;">
    <div class="actions" style="margin-top:16px;">
      <button class="btn btn-primary" id="d-done" style="width:100%;">تم</button>
    </div>
  `;
  document.getElementById('detail-close').addEventListener('click', ()=>{ closeDetailModal(); render(); });
  document.getElementById('d-done').addEventListener('click', ()=>{ closeDetailModal(); render(); });
  document.getElementById('d-text-input').addEventListener('input', e=>{ cat.detailText = e.target.value; });
  document.getElementById('d-img-btn').addEventListener('click', ()=> document.getElementById('d-file').click());
  document.getElementById('d-file').addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(f){
      const oldPath = cat.detailImagePath;
      const dataUrl = await resizeImageJPEG(f, 700, 0.75);
      const up = await uploadImageDataUrl(dataUrl, 'categories', 'jpg');
      cat.detailImage = up.url;
      cat.detailImagePath = up.path;
      if(oldPath) await deleteStoragePath(oldPath);
      openDetailEdit(id, t);
    }
  });
  const rmBtn = document.getElementById('d-img-rm');
  if(rmBtn) rmBtn.addEventListener('click', async ()=>{
    if(cat.detailImagePath) await deleteStoragePath(cat.detailImagePath);
    cat.detailImage=''; cat.detailImagePath=''; openDetailEdit(id, t);
  });
  document.getElementById('detail-modal').classList.add('show');
}

}

document.getElementById('pin-ok').addEventListener('click', tryPin);

  if(e.key==='Enter') tryPin();
});

document.getElementById('admin-email').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('pin-input').focus();
});

async function tryPin(){
  await ensureSupabaseClient();
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('pin-input').value;

  if(!email || !password){
    showToast("أدخل البريد الإلكتروني وكلمة المرور");
    return;
  }

  const btn = document.getElementById('pin-ok');
  btn.disabled = true;
  btn.textContent = "جارِ الدخول…";

  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    isAdmin = !!data.session;
    lang = 'ar';
    setLocalLanguage(lang);
    const authoritative = await loadStateFromDatabase();
    await normalizeState(authoritative || defaultState());

    document.getElementById('pin-modal').classList.remove('show');
    document.getElementById('pin-input').value = '';
    render();

    showToast("تم تسجيل الدخول بنجاح ✓");
  }catch(e){
    console.error("Supabase login error:", e);
    showToast("فشل تسجيل الدخول: " + (e.message || "تحقق من البيانات"));
  }finally{
    btn.disabled = false;
    btn.textContent = "دخول";
  }
}

async function logoutAdmin(){
  await ensureSupabaseClient();
  const { error } = await supabaseClient.auth.signOut();
  if(error){
    console.error(error);
    showToast("تعذّر تسجيل الخروج");
    return;
  }
  isAdmin = false;
  document.getElementById('pin-modal').classList.remove('show');
  render();
  showToast("تم تسجيل الخروج");
}

document.getElementById('admin-logout').addEventListener('click', logoutAdmin);

async function initSupabaseAuth(){
  try{
    await ensureSupabaseClient();
    const { data: { session } } = await supabaseClient.auth.getSession();
    isAdmin = !!session;
    supabaseClient.auth.onAuthStateChange((_event, session)=>{
      isAdmin = !!session;
      render();
    });
  }catch(e){
    console.error("Supabase Auth initialization error:", e);
    isAdmin=false;
  }
}

(async function boot(){
  // Public visitors use the same-origin static snapshot. Supabase is loaded only for admin actions.
  await loadState();
})();
